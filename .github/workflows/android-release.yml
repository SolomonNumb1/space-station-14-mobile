name: Build Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Mobile Patches
        run: |
          cd space-station-14/RobustToolbox
          git apply --ignore-whitespace --whitespace=nowarn ../../RobustToolbox/patches/mobile.patch
          cd ../..
          cd space-station-14
          git apply --ignore-whitespace --whitespace=nowarn ../patches/client-fixes.patch
          cd ..

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Build Android Release APK
        run: dotnet build Content.Android/Content.Android.csproj -c Release

      - name: Find Built APK
        id: find_apk
        run: |
          APK_PATH=$(find Content.Android/bin/Release -name "*-Signed.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find Content.Android/bin/Release -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpaceStation14-Android-Release
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
